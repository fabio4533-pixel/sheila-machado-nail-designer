<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel • Sheila Machado</title>
<style>
:root{--wine:#5d2638;--rose:#b95f79;--cream:#fffaf8;--muted:#7d6b71}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--cream);color:#2f2025}.wrap{max-width:1100px;margin:auto;padding:24px}h1{font-family:Georgia,serif;color:var(--wine)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.login,.panel{background:white;border:1px solid #eadde1;border-radius:22px;padding:20px;box-shadow:0 15px 40px #5d26380b}.login{max-width:430px;margin:80px auto}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1}input,button,select{padding:12px 13px;border-radius:12px;border:1px solid #dbcbd0;font:inherit}button{background:var(--wine);color:#fff;border:0;font-weight:800;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0}.metric{background:white;border:1px solid #eadde1;border-radius:18px;padding:18px}.metric b{display:block;font-size:26px;color:var(--wine)}.metric span{color:var(--muted);font-size:13px}.booking{display:grid;grid-template-columns:1.2fr .9fr .8fr .7fr .8fr 1fr;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.small{font-size:12px;color:var(--muted)}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#f6e5ea;font-size:12px;font-weight:800}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:8px 9px;font-size:12px}.danger{background:#8e2a2a}.hidden{display:none}.panel+.panel{margin-top:18px}@media(max-width:980px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:780px){.cards{grid-template-columns:1fr 1fr}.booking{grid-template-columns:1fr;gap:6px;background:#fff;border:1px solid #eadde1;border-radius:16px;padding:14px;margin-bottom:10px}.panel{padding:14px}}
</style></head><body><div class="wrap">
<div id="login" class="login"><h1>Painel administrativo</h1><p>Digite o PIN para visualizar e administrar os agendamentos.</p><div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button onclick="login()">Entrar</button></div><p id="msg" class="small"></p></div>
<div id="app" class="hidden"><div class="top"><div><h1>Agenda da Sheila</h1><div class="small">Sheila Machado Nail Designer</div></div><button onclick="logout()">Sair</button></div>
<div class="cards">
<div class="metric"><b id="total">0</b><span>Total</span></div>
<div class="metric"><b id="pend">0</b><span>Pendentes</span></div>
<div class="metric"><b id="conf">0</b><span>Confirmados</span></div>
<div class="metric"><b id="today">0</b><span>Hoje</span></div>
<div class="metric"><b id="receivable">R$ 0,00</b><span>Valores a receber</span></div>
<div class="metric"><b id="received">R$ 0,00</b><span>Recebido</span></div>
</div>

<div class="panel">
  <div class="top"><h2>Bloquear horários</h2><button onclick="loadBlocks()">Atualizar</button></div>
  <div class="row">
    <input id="blockDate" type="date">
    <select id="blockTime">
      <option value="">Escolha o horário</option>
      <option>08:00</option><option>09:30</option><option>11:00</option><option>13:30</option><option>15:00</option><option>16:30</option><option>18:00</option>
    </select>
    <button onclick="blockTime()">Bloquear horário</button>
    <button onclick="blockDay()">Bloquear dia inteiro</button>
  </div>
  <div id="blocksList" style="margin-top:16px"></div>
</div>

<div class="panel"><div class="top"><h2>Agendamentos</h2><button onclick="loadBookings()">Atualizar</button></div><div id="list"></div></div></div>
</div>
<script>
const ENDPOINT='https://fzpffyouubmbxfwycywg.supabase.co/functions/v1/nail-bookings'; let PIN='';
const PRICES={
'Blindagem + cimentinho + esmaltação':90,
'Esmaltação em gel':80,
'Blindagem (sem pintar)':60,
'Aplicação de Alongamento F1':130,
'Alongamento F1':130,
'Manutenção (já pintada)':100,
'Manutenção':100,
'Reposição de unha':10,
'Remoção':80
};
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function getPrice(service){
  const texto=String(service||'');
  const match=texto.match(/R\$\s*([\d.]+,\d{2})/);
  if(match) return Number(match[1].replace(/\./g,'').replace(',','.'));
  return PRICES[texto]||0;
}
async function api(payload){const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,pin:PIN})});const d=await r.json();if(!r.ok) throw new Error(d.error||'Erro');return d}
async function login(){PIN=document.getElementById('pin').value.trim();document.getElementById('msg').textContent='Verificando...';try{await api({action:'list'});sessionStorage.setItem('nail_pin',PIN);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await Promise.all([loadBookings(),loadBlocks()]);}catch(e){document.getElementById('msg').textContent='PIN inválido.'}}
function logout(){sessionStorage.removeItem('nail_pin');location.reload()}
async function loadBookings(){if(!PIN)PIN=sessionStorage.getItem('nail_pin')||'';try{const d=await api({action:'list'});render(d.bookings||[])}catch(e){logout()}}
function render(items){document.getElementById('total').textContent=items.length;document.getElementById('pend').textContent=items.filter(x=>x.status==='pendente').length;document.getElementById('conf').textContent=items.filter(x=>x.status==='confirmado').length;const iso=new Date().toISOString().slice(0,10);document.getElementById('today').textContent=items.filter(x=>x.appointment_date===iso).length;
const receivable=items.filter(x=>x.status==='pendente'||x.status==='confirmado').reduce((s,x)=>s+getPrice(x.service),0);const received=items.filter(x=>x.status==='concluido').reduce((s,x)=>s+getPrice(x.service),0);document.getElementById('receivable').textContent=money(receivable);document.getElementById('received').textContent=money(received);
const list=document.getElementById('list');if(!items.length){list.innerHTML='<p class="small">Nenhum agendamento ainda.</p>';return}list.innerHTML=items.map(x=>`<div class="booking"><div><b>${esc(x.client_name)}</b><div class="small">${esc(x.whatsapp)}</div></div><div>${esc(x.service)}</div><div><b>${dateBR(x.appointment_date)}</b><div class="small">${esc(x.appointment_time)}</div></div><div><span class="tag">${esc(x.status)}</span></div><div><b>${money(getPrice(x.service))}</b></div><div class="actions"><button onclick="setStatus(${x.id},'confirmado')">Confirmar</button><button onclick="setStatus(${x.id},'concluido')">Concluir</button><button class="danger" onclick="setStatus(${x.id},'cancelado')">Cancelar</button></div></div>`).join('')}
async function setStatus(id,status){await api({action:'update',id,status});loadBookings()}
async function loadBlocks(){try{const d=await api({action:'list_blocks'});const list=document.getElementById('blocksList');const items=d.blocks||[];if(!items.length){list.innerHTML='<p class="small">Nenhum horário bloqueado.</p>';return}list.innerHTML=items.map(x=>`<div class="booking"><div><b>${dateBR(x.block_date)}</b><div class="small">${x.full_day?'Dia inteiro':esc(x.block_time)}</div></div><div>${x.full_day?'Folga / dia bloqueado':'Horário bloqueado'}</div><div></div><div><span class="tag">bloqueado</span></div><div></div><div class="actions"><button class="danger" onclick="unblockTime(${x.id})">Desbloquear</button></div></div>`).join('')}catch(e){console.error(e)}}
async function blockTime(){const block_date=document.getElementById('blockDate').value;const block_time=document.getElementById('blockTime').value;if(!block_date||!block_time){alert('Escolha a data e o horário.');return}await api({action:'block',block_date,block_time,full_day:false});loadBlocks()}
async function blockDay(){const block_date=document.getElementById('blockDate').value;if(!block_date){alert('Escolha a data.');return}await api({action:'block',block_date,full_day:true});loadBlocks()}
async function unblockTime(id){await api({action:'unblock',id});loadBlocks()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function dateBR(v){if(!v)return '';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}
PIN=sessionStorage.getItem('nail_pin')||'';if(PIN){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');Promise.all([loadBookings(),loadBlocks()])}
</script><script src="/whatsapp.js"></script><script src="/delete-booking.js"></script><script src="/faturamento.js"></script></body></html>
